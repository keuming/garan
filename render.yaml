# Blueprint Render : API gaRAN (la base reste sur Neon, les fichiers sur R2/S3)
services:
  - type: web
    name: garan-api
    runtime: node
    region: frankfurt
    plan: starter
    rootDir: apps/api
    buildCommand: npm ci --omit=dev
    preDeployCommand: npm run migrate
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL
        sync: false
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        value: https://garan.ci,https://admin.garan.ci
      - key: PUBLIC_WEB_URL
        value: https://garan.ci
      - key: STORAGE_DRIVER
        value: s3
      - key: S3_BUCKET
        sync: false
      - key: S3_ENDPOINT
        sync: false
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
      - key: TRUST_PROXY
        value: "1"
